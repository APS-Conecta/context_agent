# Publish the ExApp image of this repository to ghcr.io/<owner>/context_agent when a
# release is published, tagged with the release tag without its leading "v". A pull
# request that changes this workflow or the Dockerfile builds the image without pushing.
name: Publish image

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/image-publish.yml
      - Dockerfile

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # registry names are lowercase, owners need not be
          tag="${TAG#v}"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${tag:-pr}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: ${{ github.event_name == 'release' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push on a release
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Report the digest
        if: ${{ github.event_name == 'release' }}
        run: echo "Pushed ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
